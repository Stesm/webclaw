<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- `maximum-scale`/`user-scalable` pin the visual viewport: the dashboard
         is an app surface (the mobile PWA is installed to the home screen),
         and a pinch-zoom that fights the layout is a bug, not a feature. The
         focus-zoom half of the problem is fixed in `index.css` (a focused
         control under 16px makes iOS Safari zoom and never restore).
         `viewport-fit=cover` lets the installed app use the full screen
         instead of being letterboxed by the safe-area insets; the insets are
         then honoured as padding by the header and the chat composer. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#1e1e24" />
    <link rel="icon" type="image/png" href="/_app/logo.png" />
    <link rel="apple-touch-icon" href="/_app/icon-192.png" />
    <link rel="manifest" href="/_app/manifest.json" />
    <link
      rel="alternate"
      type="application/rss+xml"
      title="ZeroClaw Blog RSS Feed"
      href="/blog/rss.xml"
    />
    <link
      rel="alternate"
      type="application/atom+xml"
      title="ZeroClaw Blog Atom Feed"
      href="/blog/atom.xml"
    />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />
    <title>ZeroClaw</title>
  </head>
  <body>
    <div
      id="unsupported-browser"
      style="display:none;margin:2rem auto;max-width:720px;padding:1rem 1.25rem;border:1px solid #7f1d1d;border-radius:0.75rem;background:#1f1414;color:#fecaca;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.5;"
    >
      Your browser is not supported for the ZeroClaw web dashboard. Please use
      Chrome 111+, Edge 111+, Firefox 113+, or Safari 16.2+.
    </div>
    <div id="root"></div>
    <script>
      (function () {
        var supportsColorMix =
          typeof CSS !== "undefined" &&
          typeof CSS.supports === "function" &&
          CSS.supports("color", "color-mix(in srgb, red 50%, blue)");
        var supportsStructuredClone = typeof structuredClone === "function";
        var root = document.getElementById("root");
        var banner = document.getElementById("unsupported-browser");

        if (!supportsColorMix || !supportsStructuredClone) {
          document.documentElement.setAttribute("data-unsupported-browser", "1");
          if (root) {
            root.style.display = "none";
          }
          if (banner) {
            banner.style.display = "block";
          }
        }
      })();
    </script>
    <script>
      // Mark the document as an installed app. `display-mode: standalone` is
      // the standard signal, but iOS still exposes the legacy
      // `navigator.standalone` on some versions — and on those the media
      // query may not match, which would leave the app shell sized to the
      // short viewport and a dead band at the bottom of the screen. Flagging
      // it here lets the CSS in `index.css` cover both.
      (function () {
        try {
          var standalone =
            window.matchMedia("(display-mode: standalone)").matches ||
            window.navigator.standalone === true;
          if (standalone) {
            document.documentElement.setAttribute("data-standalone", "1");
          }
        } catch (e) {
          /* no matchMedia / no navigator.standalone: the CSS query decides */
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
